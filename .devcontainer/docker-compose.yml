version: '3'
services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: access_logs_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../initdb:/docker-entrypoint-initdb.d

  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.app
    depends_on:
      - mysql
    volumes:
      - ..:/workspace
    working_dir: /workspace
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  mysql-data:
